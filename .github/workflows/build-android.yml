name: Build AllenaMente Android APK & AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build APK (Debug + Optional Signed Release)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK & Licenses
        uses: android-actions/setup-android@v3
        with:
          packages: >
            platform-tools
            platforms;android-36
            platforms;android-36.1
            build-tools;36.0.0
            build-tools;36.1.0
        continue-on-error: true

      - name: Accept Android SDK Licenses (fallback)
        run: |
          SDK_BIN="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          if [ -x "$SDK_BIN" ]; then
            yes | "$SDK_BIN" --licenses > /dev/null 2>&1 || true
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1

      - name: Restore debug.keystore & .env placeholder
        run: |
          if [ ! -f .env ] && [ -f .env.example ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            tr -d '\r\n ' < debug.keystore.base64 | base64 --decode > debug.keystore
          elif [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Run AllenaMente unit tests
        run: gradle :app:testDebugUnitTest --tests com.example.AllenaMenteEngineTest --no-daemon --stacktrace

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename Debug APK for easy download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/AllenaMente-debug.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AllenaMente-Debug-APK
          path: dist/AllenaMente-debug.apk
          retention-days: 30

      # Optional: builds signed Play Store AAB & Release APK automatically once
      # RELEASE_KEYSTORE_BASE64, STORE_PASSWORD, and KEY_PASSWORD are set in GitHub Secrets.
      - name: Check optional release signing secrets
        id: check_release
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Signed Release AAB & APK (if release secrets configured)
        if: steps.check_release.outputs.ready == 'true'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > my-upload-key.jks
          export KEYSTORE_PATH="$PWD/my-upload-key.jks"
          gradle :app:bundleRelease :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/bundle/release/app-release.aab dist/AllenaMente-release.aab
          cp app/build/outputs/apk/release/app-release.apk dist/AllenaMente-release.apk
          rm -f my-upload-key.jks

      - name: Upload Signed Release AAB & APK Artifacts
        if: steps.check_release.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AllenaMente-PlayStore-Release
          path: |
            dist/AllenaMente-release.aab
            dist/AllenaMente-release.apk
          retention-days: 30
